<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-label="SEO audit dashboard">
  <defs>
    <linearGradient id="h-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="h-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="h-shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="h-card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- soft backdrop blob -->
  <ellipse cx="320" cy="240" rx="280" ry="200" fill="#ecfdf5" opacity="0.6"/>

  <!-- main dashboard window -->
  <g filter="url(#h-shadow)">
    <rect x="48" y="32" width="544" height="416" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- browser chrome -->
    <rect x="48" y="32" width="544" height="44" rx="20" fill="#f8fafc"/>
    <rect x="48" y="60" width="544" height="16" fill="#f8fafc"/>
    <circle cx="76" cy="54" r="5" fill="#f87171"/>
    <circle cx="94" cy="54" r="5" fill="#fbbf24"/>
    <circle cx="112" cy="54" r="5" fill="#34d399"/>
    <rect x="160" y="46" width="220" height="16" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="172" y="51" width="120" height="6" rx="3" fill="#cbd5e1"/>
  </g>

  <!-- header row -->
  <text x="72" y="108" fill="#0f172a" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600">Audit Report</text>
  <text x="72" y="126" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="11">flexodynsolutions.com</text>

  <!-- overall grade card -->
  <g filter="url(#h-card)">
    <rect x="72" y="144" width="168" height="140" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="92" y="168" fill="#64748b" font-family="system-ui,sans-serif" font-size="10" font-weight="500" letter-spacing="0.05em">OVERALL GRADE</text>
    <rect x="92" y="178" width="52" height="52" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="118" y="212" text-anchor="middle" fill="#059669" font-family="Georgia,serif" font-size="26" font-weight="700">B</text>
    <text x="156" y="200" fill="#0f172a" font-family="system-ui,sans-serif" font-size="22" font-weight="700">82</text>
    <text x="156" y="218" fill="#64748b" font-family="system-ui,sans-serif" font-size="10">/ 100 score</text>
    <rect x="92" y="248" width="128" height="6" rx="3" fill="#f1f5f9"/>
    <rect x="92" y="248" width="105" height="6" rx="3" fill="url(#h-green)"/>
    <text x="92" y="272" fill="#059669" font-family="system-ui,sans-serif" font-size="10" font-weight="500">14 recommendations</text>
  </g>

  <!-- category scores -->
  <g filter="url(#h-card)">
    <rect x="256" y="144" width="312" height="140" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="276" y="168" fill="#64748b" font-family="system-ui,sans-serif" font-size="10" font-weight="500" letter-spacing="0.05em">CATEGORY SCORES</text>
    <!-- 5 mini cards -->
    <g font-family="system-ui,sans-serif">
      <rect x="276" y="180" width="52" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="302" y="200" text-anchor="middle" fill="#64748b" font-size="8">ON-PAGE</text>
      <text x="302" y="228" text-anchor="middle" fill="#059669" font-size="18" font-weight="700">A-</text>
      <rect x="336" y="180" width="52" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="362" y="200" text-anchor="middle" fill="#64748b" font-size="8">LINKS</text>
      <text x="362" y="228" text-anchor="middle" fill="#059669" font-size="18" font-weight="700">A-</text>
      <rect x="396" y="180" width="52" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="422" y="200" text-anchor="middle" fill="#64748b" font-size="8">UI</text>
      <text x="422" y="228" text-anchor="middle" fill="#f59e0b" font-size="18" font-weight="700">C</text>
      <rect x="456" y="180" width="52" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="482" y="200" text-anchor="middle" fill="#64748b" font-size="8">PERF</text>
      <text x="482" y="228" text-anchor="middle" fill="#059669" font-size="18" font-weight="700">A</text>
      <rect x="516" y="180" width="52" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="542" y="200" text-anchor="middle" fill="#64748b" font-size="8">SOCIAL</text>
      <text x="542" y="228" text-anchor="middle" fill="#059669" font-size="18" font-weight="700">A+</text>
    </g>
  </g>

  <!-- issues panel -->
  <g filter="url(#h-card)">
    <rect x="72" y="300" width="496" height="132" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="92" y="324" fill="#64748b" font-family="system-ui,sans-serif" font-size="10" font-weight="500" letter-spacing="0.05em">TOP RECOMMENDATIONS</text>

    <!-- issue 1 -->
    <rect x="92" y="336" width="456" height="36" rx="8" fill="#f8fafc"/>
    <rect x="100" y="346" width="48" height="16" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="124" y="357" text-anchor="middle" fill="#dc2626" font-family="system-ui,sans-serif" font-size="9" font-weight="600">Critical</text>
    <text x="160" y="357" fill="#0f172a" font-family="system-ui,sans-serif" font-size="11" font-weight="500">Meta description missing on homepage</text>
    <path d="M530 354l6 6-6 6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- issue 2 -->
    <rect x="92" y="380" width="456" height="36" rx="8" fill="#f8fafc"/>
    <rect x="100" y="390" width="52" height="16" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="126" y="401" text-anchor="middle" fill="#d97706" font-family="system-ui,sans-serif" font-size="9" font-weight="600">Warning</text>
    <text x="164" y="401" fill="#0f172a" font-family="system-ui,sans-serif" font-size="11" font-weight="500">Improve Largest Contentful Paint (LCP)</text>
    <path d="M530 398l6 6-6 6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- decorative score ring (floating) -->
  <g transform="translate(548,88)">
    <circle cx="0" cy="0" r="36" fill="#ffffff" filter="url(#h-card)"/>
    <circle cx="0" cy="0" r="28" stroke="#e2e8f0" stroke-width="5" fill="none"/>
    <circle cx="0" cy="0" r="28" stroke="url(#h-ring)" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="32" transform="rotate(-90)"/>
    <text x="0" y="5" text-anchor="middle" fill="#059669" font-family="system-ui,sans-serif" font-size="14" font-weight="700">82</text>
  </g>
</svg>
